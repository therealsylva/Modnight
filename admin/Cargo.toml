[package]
name = "modnight-admin"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "modnight"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
inquire = "0.7"
reqwest = { version = "0.11", features = ["json", "multipart", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
toml = "0.8"
dirs = "5"
indicatif = "0.17"
tabled = "0.15"
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2.1"
